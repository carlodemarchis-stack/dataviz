<style>
:root{
  --bg:#070910; --ink:#eef1f8; --muted:#98a2ba; --muted-2:#606a82;
  --line:rgba(150,166,205,.14); --line-2:rgba(150,166,205,.09);
  --panel-a:rgba(255,255,255,.055); --panel-b:rgba(255,255,255,.014);
  --gold:#f2c14e; --teal:#00d7b6; --green:#2f9e57;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --pad:clamp(20px,5vw,64px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-weight:300; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:clip;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(70% 55% at 12% -8%, rgba(242,193,78,.10) 0%, transparent 62%),
    radial-gradient(60% 50% at 88% 4%, rgba(0,215,182,.09) 0%, transparent 60%);
}
a{color:inherit}
.wrap{max-width:980px; margin:0 auto; padding:0 var(--pad)}

.dots{display:inline-flex; gap:4px}
.dots i{width:6px; height:6px; border-radius:50%; display:block}
.dots i:nth-child(1){background:var(--green)}
.dots i:nth-child(2){background:var(--gold)}
.dots i:nth-child(3){background:var(--teal)}

header{padding:clamp(48px,9vh,96px) 0 clamp(20px,3vh,32px)}
.eyebrow{
  display:inline-flex; align-items:center; gap:10px; text-decoration:none;
  font-size:12px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--muted);
}
.eyebrow:hover{color:var(--ink)}
h1{margin:clamp(18px,3vh,28px) 0 0; font-weight:300; letter-spacing:-.025em; line-height:1.04; font-size:clamp(36px,6.4vw,72px)}
h1 b{font-weight:700}
.lede{margin:18px 0 0; max-width:60ch; color:var(--muted); font-size:clamp(15px,1.6vw,18px)}

/* jump strip: one chip per app, carrying its current version */
.jump{display:flex; flex-wrap:wrap; gap:8px; margin:clamp(26px,4vh,36px) 0 0; padding:0; list-style:none}
.jump a{
  display:inline-flex; align-items:center; gap:8px; text-decoration:none; white-space:nowrap;
  font-size:13px; color:var(--ink); border:1px solid var(--line); border-radius:999px;
  padding:6px 12px 6px 10px; background:rgba(255,255,255,.025); transition:border-color .2s, background .2s;
}
.jump a:hover{border-color:color-mix(in srgb, var(--c) 55%, transparent); background:rgba(255,255,255,.05)}
.jump i{width:8px; height:8px; border-radius:50%; background:var(--c); display:block}
.jump small{color:var(--muted-2); font-size:11.5px; letter-spacing:.02em}

main{padding-bottom:clamp(40px,7vh,80px)}
.app{
  margin-top:clamp(26px,4vh,40px); border:1px solid var(--line); border-radius:20px;
  background:linear-gradient(160deg,var(--panel-a),var(--panel-b)); overflow:hidden;
  scroll-margin-top:24px; transition:border-color .6s, box-shadow .6s;
}
.app.flash{border-color:color-mix(in srgb, var(--c) 60%, transparent); box-shadow:0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent)}
.apphead{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;
  padding:20px 24px; border-bottom:1px solid var(--line-2); position:relative;
}
.apphead::before{content:''; position:absolute; left:24px; right:24px; top:0; height:2px; background:var(--c); opacity:.85; border-radius:0 0 2px 2px}
.apphead .dot{width:10px; height:10px; border-radius:50%; background:var(--c); flex:none}
.apphead h2{margin:0; font-size:21px; font-weight:700; letter-spacing:-.01em}
.apphead .kicker{color:var(--muted); font-size:14px}
.apphead .gap{flex:1 1 auto}
.ver{
  font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--c);
  border:1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius:999px; padding:3px 10px;
}
.open{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--c); text-decoration:none}
.open svg{width:11px; height:11px}

.rel{display:grid; grid-template-columns:130px minmax(0,1fr); gap:6px 24px; padding:16px 24px; border-top:1px solid var(--line-2)}
.rel:first-of-type{border-top:0}
.rel .v{font-size:15px; font-weight:700; color:var(--ink); letter-spacing:.01em}
.rel .v small{display:block; font-size:12px; font-weight:300; color:var(--muted-2); letter-spacing:.02em; margin-top:1px}
.rel ul{margin:0; padding:0 0 0 18px; color:var(--muted); font-size:14.5px; line-height:1.6}
.rel li + li{margin-top:4px}
.rel li::marker{color:var(--c)}
.rel.latest .v{color:var(--c)}

.state{color:var(--muted); font-size:14px; margin-top:32px}

footer{border-top:1px solid var(--line-2); padding:28px 0 48px; color:var(--muted-2); font-size:13.5px}
footer a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line)}
footer a:hover{color:var(--ink)}

@media (max-width:640px){
  .rel{grid-template-columns:1fr; gap:4px}
  .rel .v small{display:inline; margin-left:8px}
  .apphead .gap{display:none}
}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *{transition:none !important} }
</style>

<script defer src="https://m.aguywithascarf.com/k.js" data-website-id="eebb8dd0-e538-4533-ab76-d8d90eaa084e"></script>

</head>
<body>
<div class="wrap">

  <header>
    <a class="eyebrow" href="../"><span class="dots"><i></i><i></i><i></i></span> A guy with a scarf</a>
    <h1>Release <b>notes</b></h1>
    <p class="lede">
      What has changed across the sport experiences, newest first. Each app keeps its own
      version number, so a change to one never moves another.
    </p>
    <ul class="jump" id="jump" aria-label="Jump to an app"></ul>
  </header>

  <main id="apps"><p class="state">Loading…</p></main>

  <footer>
    <a href="../">All the experiences</a> &nbsp;·&nbsp; Produced with passion by
    <a href="https://www.linkedin.com/in/carlodemarchis/" rel="me noopener" target="_blank">A guy with a scarf</a> (Carlo De Marchis)
  </footer>

</div>

<script>
// Everything on this page comes from /releases.json — the same file each app reads for its
// version badge. Edit the JSON, and both the notes and every badge follow.
(function () {
  var ARROW = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5 9.5 2.5M4 2.5h5.5V8"/></svg>';
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmt(iso) { var p = iso.split('-'); return (+p[2]) + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0]; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  var main = document.getElementById('apps'), jump = document.getElementById('jump');

  fetch('/releases.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
    main.textContent = '';
    d.apps.forEach(function (a) {
      var latest = a.releases[0];

      // jump chip
      var li = el('li'), ja = el('a');
      ja.href = '#' + a.id; ja.style.setProperty('--c', a.color);
      ja.appendChild(el('i')); ja.appendChild(document.createTextNode(a.name + ' '));
      ja.appendChild(el('small', null, 'v' + latest.version));
      li.appendChild(ja); jump.appendChild(li);

      // section
      var sec = el('section', 'app'); sec.id = a.id; sec.style.setProperty('--c', a.color);
      var head = el('div', 'apphead');
      head.appendChild(el('span', 'dot'));
      head.appendChild(el('h2', null, a.name));
      head.appendChild(el('span', 'kicker', a.kicker));
      head.appendChild(el('span', 'gap'));
      head.appendChild(el('span', 'ver', 'v' + latest.version));
      var open = el('a', 'open'); open.href = a.url; open.target = '_blank'; open.rel = 'noopener';
      open.innerHTML = 'Open ' + ARROW;               // static markup, no data in it
      head.appendChild(open);
      sec.appendChild(head);

      a.releases.forEach(function (r, i) {
        var row = el('div', 'rel' + (i === 0 ? ' latest' : ''));
        var v = el('div', 'v', 'v' + r.version); v.appendChild(el('small', null, fmt(r.date)));
        var ul = el('ul'); r.notes.forEach(function (n) { ul.appendChild(el('li', null, n)); });
        row.appendChild(v); row.appendChild(ul); sec.appendChild(row);
      });
      main.appendChild(sec);
    });

    // an app linked by anchor (/releases/#f1) is scrolled to and briefly lit
    var id = decodeURIComponent(location.hash.slice(1)), target = id && document.getElementById(id);
    if (target) {
      target.scrollIntoView({ block: 'start' });
      target.classList.add('flash'); setTimeout(function () { target.classList.remove('flash'); }, 1800);
    }
  }).catch(function () {
    main.innerHTML = '<p class="state">The release notes could not be loaded. Please try again shortly.</p>';
  });
})();
</script>
</body>
</html>
